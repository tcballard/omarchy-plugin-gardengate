[package]
name = "gardengate"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Local iCloud Drive inbox for Omarchy (developer preview)"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
