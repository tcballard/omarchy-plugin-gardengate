name: Prebuilt installer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned build toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: ./tests/run
      - name: Check and test companion
        working-directory: companion
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      - name: Build prebuilt installer
        run: python3 scripts/build-installer.py
      - name: Verify installer payload
        run: |
          bash dist/gardengate-0.0.2-linux-x86_64.run --check
          cd dist
          sha256sum --check SHA256SUMS
      - name: Exercise installer lifecycle with desktop stubs
        run: python3 tests/test_installer_bundle.py dist/gardengate-0.0.2-linux-x86_64.run
      - name: Exercise graphical onboarding with desktop/provider stubs
        run: python3 tests/test_desktop_setup.py companion/target/release/gardengate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gardengate-linux-x86_64-installer
          path: dist/
          if-no-files-found: error
